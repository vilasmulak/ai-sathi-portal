
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI साथी | लॉगिन</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      background: linear-gradient(135deg, #e8f0ff, #e8fff5);
      color: #1f2937;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 26px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 48px;
    }

    h1 {
      margin: 8px 0;
      text-align: center;
      color: #1557b0;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 28px;
      text-align: center;
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #1557b0;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      margin-top: 10px;
      background: #edf4ff;
      color: #1557b0;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      display: none;
    }

    .error {
      display: block !important;
      color: #991b1b;
      background: #fee2e2;
    }

    .success {
      display: block !important;
      color: #166534;
      background: #dcfce7;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">🤖</div>
    <h1>AI साथी</h1>
    <p class="subtitle">
      शिक्षण विभाग आणि PM POSHAN<br>
      आपल्या खात्याद्वारे लॉगिन करा
    </p>

    <form id="loginForm">
      <label for="email">ई-मेल पत्ता</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        placeholder="आपला ई-मेल टाका"
        required
      >

      <label for="password">पासवर्ड</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="आपला पासवर्ड टाका"
        required
      >

      <button type="submit" id="loginButton">
        लॉगिन करा
      </button>

      <button type="button" class="secondary" id="resetButton">
        पासवर्ड विसरलात?
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
      AI साथी | मराठी डिजिटल पोर्टल
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    "use strict";

    // तुमच्या विद्यमान Firebase प्रोजेक्टची माहिती
    const firebaseConfig = {
  apiKey: "AIzaSyAUh6tmbyQ3qvPHcCAvAVQSZGF-_k3cwDc",
  authDomain: "ai-sathi-portal.firebaseapp.com",
  projectId: "ai-sathi-portal",
  storageBucket: "ai-sathi-portal.firebasestorage.app",
  messagingSenderId: "87410372148",
  appId: "1:87410372148:web:0063e6a3780f38f2f2e461",
  measurementId: "G-7VPK79ZLDF"
};

    const messageBox = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const resetButton = document.getElementById("resetButton");

    function showMessage(message, success = false) {
      messageBox.textContent = message;
      messageBox.className = success ? "success" : "error";
    }

    function getFriendlyError(error) {
      const code = error && error.code ? error.code : "";

      const messages = {
        "auth/invalid-email": "ई-मेल पत्ता योग्य नाही.",
        "auth/user-not-found": "या ई-मेलसाठी खाते सापडले नाही.",
        "auth/wrong-password": "पासवर्ड चुकीचा आहे.",
        "auth/invalid-credential": "ई-मेल किंवा पासवर्ड चुकीचा आहे.",
        "auth/too-many-requests": "अनेक प्रयत्न झाले. थोड्या वेळाने पुन्हा प्रयत्न करा.",
        "auth/network-request-failed": "इंटरनेट कनेक्शन तपासा.",
        "auth/api-key-not-valid": "Firebase API key वैध नाही. Firebase कॉन्फिगरेशन तपासणे आवश्यक आहे.",
        "auth/operation-not-allowed": "Firebase मध्ये ही लॉगिन पद्धत उपलब्ध नाही.",
        "auth/unauthorized-domain": "ही वेबसाइट Firebase Authentication साठी अधिकृत केलेली नाही."
      };

      return messages[code] ||
        "लॉगिन अयशस्वी झाले. कृपया त्रुटीचा कोड तपासा: " +
        (code || "unknown-error");
    }

    let auth = null;
    let firebaseReady = false;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      auth = firebase.auth();
      firebaseReady = true;

      auth.setPersistence(
        firebase.auth.Auth.Persistence.LOCAL
      ).catch(function(error) {
        console.error("Persistence error:", error);
      });

    } catch (error) {
      console.error("Firebase initialization error:", error);
      showMessage(
        "Firebase सुरू झाले नाही. पेजचा कोड आणि Firebase कॉन्फिगरेशन तपासा."
      );
    }

    function getNextPage() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");

      if (next === "pm-poshan.html") {
        return "pm-poshan.html";
      }

      return "education-dashboard.html";
    }

    document.getElementById("loginForm").addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();

        if (!firebaseReady || !auth) {
          showMessage("Firebase सुरू झालेले नाही. कॉन्फिगरेशनची दुरुस्ती आवश्यक आहे.");
          return;
        }

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        loginButton.disabled = true;
        loginButton.textContent = "लॉगिन होत आहे...";

        try {
          await auth.signInWithEmailAndPassword(email, password);

          showMessage("लॉगिन यशस्वी! पेज उघडत आहे...", true);

          window.location.replace(getNextPage());

        } catch (error) {
          console.error("Firebase login error:", error);
          showMessage(getFriendlyError(error));

          loginButton.disabled = false;
          loginButton.textContent = "लॉगिन करा";
        }
      }
    );

    resetButton.addEventListener("click", async function() {
      if (!firebaseReady || !auth) {
        showMessage("Firebase कॉन्फिगरेशनची दुरुस्ती आवश्यक आहे.");
        return;
      }

      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("आधी ई-मेल पत्ता टाका.");
        document.getElementById("email").focus();
        return;
      }

      resetButton.disabled = true;

      try {
        await auth.sendPasswordResetEmail(email);
        showMessage("पासवर्ड बदलण्यासाठीची लिंक ई-मेलवर पाठवली आहे.", true);
      } catch (error) {
        console.error("Password reset error:", error);
        showMessage(getFriendlyError(error));
      } finally {
        resetButton.disabled = false;
      }
    });
  </script>
</body>
</html>
