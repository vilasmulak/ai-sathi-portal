<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI साथी | लॉगिन</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Devanagari",Arial,sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(100%,430px);background:#fff;border:1px solid #e4e9f2;border-radius:22px;padding:28px;box-shadow:0 18px 50px #1d355710}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#e8f0ff;font-size:27px}
h1{font-size:25px;margin:0 0 4px}.sub{color:#64748b;margin:0;font-size:14px}
label{display:block;font-weight:650;margin:16px 0 7px;font-size:14px}
input{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font:inherit;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
button{width:100%;border:0;border-radius:12px;padding:13px 16px;background:#1d4ed8;color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:20px}
button:disabled{opacity:.65;cursor:wait}.links{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:14px}
a{color:#1d4ed8;text-decoration:none}.msg{min-height:24px;margin-top:14px;font-size:14px;overflow-wrap:anywhere}
.foot{font-size:12px;color:#64748b;text-align:center;margin-top:22px}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">🤖</div><div><h1>AI साथी</h1><p class="sub">मराठी डिजिटल पोर्टल</p></div></div>
  <p class="sub">तुमच्या खात्यात लॉगिन करा. हेच लॉगिन शिक्षण विभाग आणि PM POSHAN साठी वापरले जाईल.</p>
  <form id="loginForm">
    <label for="email">ई-मेल</label>
    <input id="email" type="email" autocomplete="username" required placeholder="तुमचा ई-मेल">
    <label for="password">पासवर्ड</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="पासवर्ड">
    <button id="loginButton" type="submit">लॉगिन करा</button>
    <div id="message" class="msg" role="status" aria-live="polite"></div>
  </form>
  <div class="links"><a href="#" id="forgotLink">पासवर्ड विसरलात?</a><a href="index.html">मुख्य पृष्ठ</a></div>
  <p class="foot">© AI साथी | सुरक्षित शाळा डिजिटल सेवा</p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
"use strict";
const firebaseConfig = {
  apiKey: "AIzaSyAw202kspjUGbDFKxugJxdPP4H4lqeG8Fg",
  authDomain: "ai-sathi-portal.firebaseapp.com",
  projectId: "ai-sathi-portal",
  storageBucket: "ai-sathi-portal.firebasestorage.app",
  messagingSenderId: "87410372148",
  appId: "1:87410372148:web:0063e6a3780f38f2f2e461",
  measurementId: "G-7VPK79ZLDF"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");
const forgotLink = document.getElementById("forgotLink");

function getSafeNextPage() {
  const next = new URLSearchParams(window.location.search).get("next");
  return next === "pm-poshan.html" ? "pm-poshan.html" : "education-dashboard.html";
}
function friendlyError(error) {
  const messages = {
    "auth/invalid-credential": "ई-मेल किंवा पासवर्ड चुकीचा आहे.",
    "auth/wrong-password": "पासवर्ड चुकीचा आहे.",
    "auth/user-not-found": "या ई-मेलसाठी खाते सापडले नाही.",
    "auth/invalid-email": "कृपया योग्य ई-मेल भरा.",
    "auth/too-many-requests": "अनेक प्रयत्न झाले आहेत. थोड्या वेळाने पुन्हा प्रयत्न करा.",
    "auth/network-request-failed": "इंटरनेट कनेक्शन तपासा.",
    "auth/operation-not-allowed": "Firebase मध्ये Email/Password Login सुरू करा."
  };
  return messages[error.code] || "लॉगिन झाले नाही. कृपया पुन्हा प्रयत्न करा.";
}
document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  message.style.color = "#b91c1c";
  message.textContent = "";
  loginButton.disabled = true;
  loginButton.textContent = "लॉगिन होत आहे...";
  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    await auth.signInWithEmailAndPassword(emailInput.value.trim(), passwordInput.value);
    message.style.color = "#166534";
    message.textContent = "लॉगिन यशस्वी! पेज उघडत आहे...";
    window.setTimeout(() => window.location.replace(getSafeNextPage()), 500);
  } catch (error) {
    console.error("AI साथी login error:", error);
    message.textContent = friendlyError(error);
    loginButton.disabled = false;
    loginButton.textContent = "लॉगिन करा";
  }
});
forgotLink.addEventListener("click", async (event) => {
  event.preventDefault();
  const email = emailInput.value.trim();
  if (!email) {
    message.style.color = "#b91c1c";
    message.textContent = "पासवर्ड रीसेट करण्यासाठी आधी ई-मेल भरा.";
    emailInput.focus();
    return;
  }
  try {
    await auth.sendPasswordResetEmail(email);
    message.style.color = "#166534";
    message.textContent = "पासवर्ड रीसेट करण्याची लिंक ई-मेलवर पाठवली आहे.";
  } catch (error) {
    console.error("Password reset error:", error);
    message.style.color = "#b91c1c";
    message.textContent = friendlyError(error);
  }
});
</script>
</body>
</html>
